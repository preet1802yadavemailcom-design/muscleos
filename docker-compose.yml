version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: muscleos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-muscleos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-muscleos_secret_2024}
      POSTGRES_DB: ${DB_NAME:-muscleos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-muscleos} -d ${DB_NAME:-muscleos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - muscleos-network

  redis:
    image: redis:7-alpine
    container_name: muscleos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - muscleos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: muscleos-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-muscleos}:${DB_PASSWORD:-muscleos_secret_2024}@postgres:5432/${DB_NAME:-muscleos}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-muscleos_jwt_super_secret_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-muscleos_refresh_super_secret_key}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - muscleos-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: muscleos-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - muscleos-network

  nginx:
    image: nginx:alpine
    container_name: muscleos-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - muscleos-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  muscleos-network:
    driver: bridge
